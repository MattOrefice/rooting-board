// ---------- app ----------
const readLocal = () => { try { const v = localStorage.getItem(KEY); return v ? migrate(JSON.parse(v)) : null; } catch (e) { return null; } };
const fetchPublished = async () => { try { const r = await fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' }); return r.ok ? migrate(await r.json()) : null; } catch (e) { return null; } };
function App() {
  const [data, setData] = useState(() => migrate(EMPTY));
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState('root');
  const [published, setPublished] = useState(null);
  const [source, setSource] = useState('');
  useEffect(() => {
    let alive = true;
    (async () => {
      const pub = await fetchPublished();
      const loc = readLocal();
      if (!alive) return;
      setPublished(pub);
      const newer = (x, y) => ((x && x.updatedAt) || '') > ((y && y.updatedAt) || '');
      if (pub && loc && newer(loc, pub)) { setData(loc); setSource('local'); }
      else if (pub) { setData(pub); setSource('published'); }
      else if (loc) { setData(loc); setSource('local'); }
      else setSource('none');
      setLoaded(true);
    })();
    return () => { alive = false; };
  }, []);
  useEffect(() => { if (loaded) { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* storage unavailable */ } } }, [data, loaded]);
  const update = (fn) => { setData((d) => { const c = JSON.parse(JSON.stringify(d)); fn(c); c.updatedAt = new Date().toISOString(); return c; }); setSource('local'); };
  const replaceData = (d) => { setData(Object.assign({}, d, { updatedAt: new Date().toISOString() })); setSource('local'); };
  const loadPublished = async () => { const pub = await fetchPublished(); if (pub) { setPublished(pub); setData(pub); setSource('published'); } };

  const src = source === 'published' ? 'Updated ' + fmtWhen(data.updatedAt) : source === 'local' ? 'Showing your edits from ' + fmtWhen(data.updatedAt) : source === 'none' ? 'No published data found' : '';

      : tab === 'bets' ? h(BetsTab, { data, update })

}
