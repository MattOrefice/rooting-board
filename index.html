<!doctype html>
<html lang="en">

<style>
:root{--bg:#0F201A;--panel:#152A21;--panel2:#1B3429;--line:#244234;--line2:#2F5443;--text:#EEF3EE;--muted:#9DB2A6;--dim:#6E887B;--flag:#F2C230;--red:#E4483E;--good:#7CE3A3;--bad:#FF7B6E;--blue:#7DBBFF}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:14px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-weight:700;margin:0}
.tnum{font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto;padding:20px 16px 64px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-bottom:18px}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-bottom:10px}
.brand h1{font-size:36px;font-weight:800;line-height:1;letter-spacing:.2px}
.brand .wk{color:var(--muted);font-weight:600;font-size:15px}
.brand .src{color:var(--dim);font-size:12px}
.tabs{display:flex;gap:2px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;color:var(--muted);font-weight:600;padding:10px 14px;cursor:pointer}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--text);border-bottom-color:var(--flag)}
.strip{display:flex;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.strip .cell{flex:1 1 150px;padding:10px 14px;border-right:1px solid var(--line)}
.strip .cell:last-child{border-right:0}
.strip .v{font:700 25px/1.1 "Barlow Condensed",sans-serif}
.strip .l{color:var(--muted);font-size:12px;margin-top:2px}
.toolbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:14px 0 4px;color:var(--muted);font-size:13px}
.toolbar label{display:flex;align-items:center;gap:7px;cursor:pointer}
.legend{color:var(--dim);font-size:12px;margin:6px 0 0;max-width:78ch}
.slot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin:30px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.slot h2{font-size:28px;line-height:1}
.slot .times{color:var(--muted);font:600 15px Barlow,sans-serif;margin-left:12px}
.slot .rz{display:inline-block;margin-left:10px;padding:2px 7px;border-radius:4px;background:rgba(228,72,62,.16);color:#FF9A91;font:700 12px Barlow,sans-serif;vertical-align:3px}
.slot .sm{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px}
.grid>*{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px 10px;display:flex;flex-direction:column;gap:11px}
.card.live{border-color:var(--red);box-shadow:0 0 0 1px rgba(228,72,62,.3)}
.card.done{opacity:.7}
.card{scroll-margin-top:12px}
.livebar{background:var(--panel);border:1px solid var(--red);border-radius:12px;padding:8px 14px 4px;margin-top:14px}
.livebar .lb-h{font-weight:700;font-size:13px;color:#FF9A91;padding:2px 0 6px}
.lb-row{display:grid;grid-template-columns:minmax(0,1.2fr) auto minmax(0,1.6fr) auto;gap:10px;align-items:center;padding:7px 4px;border-top:1px solid var(--line);color:var(--text);text-decoration:none;border-radius:6px}
.lb-row:hover{background:var(--panel2)}
.lb-row .mt{display:flex;align-items:center;gap:6px;font:700 18px/1 "Barlow Condensed",sans-serif;white-space:nowrap}
.lb-row .clk{color:#FF9A91;font:600 12px Barlow,sans-serif;margin-left:6px}
.lb-row .st{font-size:13px;color:var(--muted)}
.lb-row .st b{color:var(--text)}
.lb-row .amt{font:700 18px/1 "Barlow Condensed",sans-serif;text-align:right}
.plate.sm{font-size:15px;padding:4px 8px 3px}
.livesrc{color:var(--dim);font-size:12px}
.prog{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;margin-top:2px}
.prog .pg{color:var(--text)}
.flag{color:var(--flag);font-weight:600}
.edgeamt{font:700 17px/1 "Barlow Condensed",sans-serif}
.tabs{overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .short{display:none}
.pick{display:inline-flex;align-items:center;justify-content:center}
span.pick{cursor:default}
.autobar{padding:10px 14px;margin-bottom:12px;font-size:13px;color:var(--muted)}
.autobar .linkbtn{color:var(--flag);font-size:13px;font-weight:600}
.sitbox{margin-top:7px}
.sit{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:13px;font-weight:600}
.rzpill{display:inline-block;background:var(--red);color:#fff;font:700 11px/1.5 Barlow,sans-serif;padding:0 7px;border-radius:4px;letter-spacing:.3px;white-space:nowrap}
.lastplay{color:var(--muted);font-size:12px;margin-top:3px}
.refresh{background:none;border:1px solid var(--line2);border-radius:5px;color:var(--muted);cursor:pointer;margin-left:8px;padding:0 6px;font-size:13px;line-height:18px;vertical-align:1px}
.refresh:hover{color:var(--text)}
.refresh.spin{animation:rbspin 1s linear infinite}
@keyframes rbspin{to{transform:rotate(360deg)}}
.livesrc.stale{color:var(--flag)}
.recap{padding:10px 14px;margin-bottom:12px;font-size:13px;border-color:var(--flag)}
.recap b{color:var(--flag)}
.recap .linkbtn{margin-left:8px}
.updbar{background:var(--flag);color:#141414;padding:9px 14px;border-radius:8px;margin-bottom:12px;font-weight:600}
.updbar .linkbtn{color:#141414;text-decoration:underline;margin-left:6px;font-weight:700}
.tb-done{margin:-4px 0 12px;font-size:13px}
.pctl{color:var(--flag);font-weight:600}
.howwent{padding:10px 14px;margin-bottom:12px;font-size:13px;color:var(--muted)}
.howwent b{color:var(--text)}
.howwent .pctl{white-space:normal}
.dv{min-width:120px}
.dv .dvl{display:flex;align-items:baseline;justify-content:flex-end;gap:6px;white-space:nowrap}
.dv .amt{font-size:21px;line-height:1.15}
.dv .amt.up{color:var(--good)}
.dv .amt.dn{color:var(--bad)}
.dv .cap{font-size:11px;color:var(--muted)}
.dv > .cap{text-align:right}
.dv2{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;font-size:13px;white-space:nowrap}
.dv2 .ok,.dv3 .ok{color:var(--good)}
.dv2 .bad,.dv3 .bad{color:var(--bad)}
.dv3{white-space:nowrap}
.tracker{margin:28px 0 22px}
.tracker .slot{margin-top:0}
.tb-settled{color:var(--muted);font-size:13px;margin:-4px 0 12px}
.donesum{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;color:var(--muted);font-size:14px;margin:-2px 0 8px}
.donesum b{color:var(--text);font-weight:600}
.grid > .card:only-child{grid-column:1/-1;max-width:820px}
.tr-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.tr-h .dim{font-size:12px}
.tr-h .linkbtn{margin-left:auto}
.tb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.tb{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tb-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tb-name{font-weight:600}
.tb-pay{margin-left:auto;color:var(--muted);font-size:13px}
.tb-st{font-size:12px;color:var(--muted);margin:2px 0 6px}
.tb-st.ok{color:var(--good)}
.tb-st.bad{color:var(--bad)}
.leg{display:grid;grid-template-columns:16px minmax(0,1fr) auto;column-gap:8px;row-gap:3px;align-items:center;font-size:13px;padding:3px 0}
.lg-mk{color:var(--dim);text-align:center;font-size:12px}
.leg.won .lg-mk{color:var(--good)}
.leg.lost .lg-mk{color:var(--bad)}
.leg.live .lg-mk{color:var(--flag)}
.leg.lost .lg-t{text-decoration:line-through;color:var(--muted)}
.lg-g{color:var(--dim);font-size:11px}
.lg-v{color:var(--muted);font-size:12px;text-align:right;white-space:nowrap}
.leg .bar{grid-column:2/-1;height:5px;border-radius:3px;background:var(--line2);overflow:hidden}
.leg .bar .fill{display:block;height:100%;background:var(--flag)}
.leg.won .bar .fill{background:var(--good)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.matchup{display:flex;align-items:center;gap:10px;font:700 24px/1 "Barlow Condensed",sans-serif}
.team{display:inline-flex;align-items:center;gap:7px}
.pts{font-size:27px;margin-left:3px}
.at{color:var(--dim);font-size:15px;font-weight:600}
.sub{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:7px}
.livepill{color:#FF9A91;font-weight:700}
.livepill:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:6px;vertical-align:1px}
.stake{text-align:right;white-space:nowrap}
.stake .amt{font:700 27px/1 "Barlow Condensed",sans-serif}
.stake .cap{color:var(--dim);font-size:11px;margin-top:3px}
.rank{display:inline-block;background:var(--text);color:var(--bg);font:800 14px/1 "Barlow Condensed",sans-serif;padding:3px 6px 2px;border-radius:4px;margin-right:8px;vertical-align:5px}
.verdict{display:flex;align-items:center;gap:6px 11px;flex-wrap:wrap}
.plate{display:inline-block;padding:6px 11px 5px;border-radius:5px;border:1px solid rgba(255,255,255,.2);font:800 21px/1 "Barlow Condensed",sans-serif;letter-spacing:.2px;background:var(--line2);color:var(--text)}
.plate.split{background:var(--flag);border-color:var(--flag);color:#1C1A0C}
.plate.outline{background:transparent;border-width:2px}
.plate.wants{background:transparent;border-color:var(--blue);color:var(--blue)}
.plate.dead,.plate.final{background:transparent;border-color:var(--line2);color:var(--muted)}
.target{font-weight:700;font-size:15px}
.note{color:var(--muted);font-size:12px;flex-basis:100%}
.rows{border-top:1px solid var(--line)}
.r{display:grid;grid-template-columns:72px minmax(0,1fr) auto minmax(16px,auto);gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.r:last-child{border-bottom:0}
.r .src{font-size:12px;font-weight:600;color:var(--muted);line-height:1.2}
.r .what{display:flex;align-items:center;gap:9px;min-width:0}
.r .txt{display:flex;flex-direction:column;min-width:0}
.r .txt b{font-weight:700}
.r .txt .d{color:var(--muted);font-size:12px}
.r .w{font:700 18px/1 "Barlow Condensed",sans-serif;text-align:right}
.r .mk{text-align:right;font-weight:700;white-space:nowrap;font-size:13px}
.r.off .txt b{color:var(--dim);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 4px;border:1px solid var(--line2);border-radius:999px;background:var(--panel2);font-size:12px;font-weight:600;white-space:nowrap}
.chip.against{border-color:rgba(255,123,110,.55)}
.chip.me{border-color:var(--flag)}
.chip.plain{padding:3px 10px}
.warnline{color:var(--flag);font-size:12px}
.foot{display:flex;justify-content:flex-end;margin-top:-4px}
.linkbtn{background:none;border:0;color:var(--dim);cursor:pointer;padding:0;font-size:12px}
.linkbtn:hover{color:var(--text)}
.logo{display:inline-block;object-fit:contain;flex:none}
.logo-fb{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:700;flex:none}
.nologo{display:inline-block;flex:none}
.quiet{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;color:var(--muted);font-size:12px}
.quiet .q{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 11px 4px 6px}
.book{display:inline-block;padding:1px 5px;border-radius:4px;font-size:11px;font-weight:700;background:var(--panel2);color:var(--muted)}
.book.DK{background:#15392A;color:#8EF0B4}
.book.FD{background:#132A4A;color:#9CCBFF}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 16px}
.panel h3{font-size:23px;line-height:1.1}
.stack{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.stack>*,.panel{min-width:0}
.scroll{max-width:100%}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
table{border-collapse:collapse;width:100%}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
input,select,textarea{background:var(--panel2);color:var(--text);border:1px solid var(--line2);border-radius:6px;padding:5px 8px;font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
input[type=number]{width:84px}
input[type=checkbox]{accent-color:var(--flag);width:15px;height:15px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:6px 12px;color:var(--text);font-weight:600;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--flag);border-color:var(--flag);color:#1C1A0C}
.btn.danger{color:var(--bad);border-color:rgba(255,123,110,.45)}
.btn.sm{padding:3px 8px;font-size:12px}
.legs{color:var(--muted);font-size:12px}
.pick{min-width:48px;height:30px;border:1px solid var(--line2);border-radius:6px;background:var(--panel2);color:var(--text);font-weight:700;font-size:13px;cursor:pointer}
.pick.me{border-color:var(--flag)}
.pick.hit{background:rgba(124,227,163,.14);color:var(--good);border-color:rgba(124,227,163,.5)}
.pick.miss{background:rgba(255,123,110,.12);color:var(--bad);border-color:rgba(255,123,110,.45)}
.pick.empty{color:var(--dim);font-weight:400}
.mini{display:flex;justify-content:center;gap:2px}
.hint{color:var(--dim);font-size:12px}
.you{color:var(--flag);font-size:12px;font-weight:600;margin-left:6px}
.ok{color:var(--good)}.bad{color:var(--bad)}.muted{color:var(--muted)}.dim{color:var(--dim)}
.empty-state{padding:28px;text-align:center;color:var(--muted)}
@media (max-width:560px){.wrap{padding:16px 12px 48px}.grid{grid-template-columns:minmax(0,1fr)}.card{padding:12px}.r{grid-template-columns:62px minmax(0,1fr) auto minmax(14px,auto);gap:8px}.lb-row{grid-template-columns:minmax(0,1fr) auto;row-gap:4px}.lb-row .mt{white-space:normal;flex-wrap:wrap;row-gap:3px}.lb-row .clk{flex-basis:100%;margin-left:0}.matchup{font-size:21px;gap:8px}.pts{font-size:23px}.stake .amt{font-size:23px}.brand h1{font-size:28px}.brand{gap:2px 10px}.top{margin-bottom:12px}.strip .cell{flex-basis:45%;padding:8px 10px}.strip .v{font-size:21px}.tabs .full{display:none}.tabs .short{display:inline}.tabs button{padding:10px 9px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
