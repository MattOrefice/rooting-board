button{font:inherit}

.at{color:var(--dim);font-size:15px;font-weight:600}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 16px}

.between{justify-content:space-between}

        h('thead', null, h('tr', null, ['Away', 'Home', 'Kickoff', 'Home line', 'Home win %', 'Status', 'Away pts', 'Home pts', 'Clock', ''].map((c, i) => h('th', { key: i }, c)))),
        h('tbody', null, data.games.map((g, i) => h('tr', { key: i },

// ---------- app ----------
const readLocal = () => { try { const v = localStorage.getItem(KEY); return v ? migrate(JSON.parse(v)) : null; } catch (e) { return null; } };
const fetchPublished = async () => { try { const r = await fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' }); return r.ok ? migrate(await r.json()) : null; } catch (e) { return null; } };
function App() {
  const [data, setData] = useState(() => migrate(EMPTY));
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState('root');
  const [published, setPublished] = useState(null);
  const [source, setSource] = useState('');
  useEffect(() => {
    let alive = true;
    (async () => {
      const pub = await fetchPublished();
      const loc = readLocal();
      if (!alive) return;
      setPublished(pub);
      const newer = (x, y) => ((x && x.updatedAt) || '') > ((y && y.updatedAt) || '');
      if (pub && loc && newer(loc, pub)) { setData(loc); setSource('local'); }
      else if (pub) { setData(pub); setSource('published'); }
      else if (loc) { setData(loc); setSource('local'); }
      else setSource('none');
      setLoaded(true);
    })();
    return () => { alive = false; };
  }, []);
  useEffect(() => { if (loaded) { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* storage unavailable */ } } }, [data, loaded]);
  const update = (fn) => { setData((d) => { const c = JSON.parse(JSON.stringify(d)); fn(c); c.updatedAt = new Date().toISOString(); return c; }); setSource('local'); };
  const replaceData = (d) => { setData(Object.assign({}, d, { updatedAt: new Date().toISOString() })); setSource('local'); };
  const loadPublished = async () => { const pub = await fetchPublished(); if (pub) { setPublished(pub); setData(pub); setSource('published'); } };
  const [live, setLive] = useState({});
  const [liveAt, setLiveAt] = useState(null);
  const [liveErr, setLiveErr] = useState(false);
  useEffect(() => {
    if (!loaded || !data.games.length) return undefined;
    let alive = true, timer = null;
    const tick = async () => {
      const res = await fetchLive(data.season, data.week);
      if (!alive) return;
      if (res) { setLive(res); setLiveAt(new Date()); setLiveErr(false); } else setLiveErr(true);
      const anyLive = !!res && Object.keys(res).some((k) => res[k].status === 'live');
      timer = setTimeout(tick, anyLive ? 60000 : 180000);
    };
    tick();
    return () => { alive = false; clearTimeout(timer); };
  }, [loaded, data.season, data.week, data.games.length]);
  const view = useMemo(() => withLive(data, live), [data, live]);
  const analyses = useMemo(() => view.games.map((g) => analyze(g, view)), [view]);
  const src = source === 'published' ? 'Updated ' + fmtWhen(data.updatedAt) : source === 'local' ? 'Showing your edits from ' + fmtWhen(data.updatedAt) : source === 'none' ? 'No published data found' : '';
  const tabs = [['root', 'Rooting guide'], ['bets', 'Bets'], ['pools', 'Pools'], ['setup', 'Setup']];
  return h('div.wrap', null,
    h('header.top', null,
      h('div.brand', null, h('h1', null, 'Rooting Board'), h('span.wk', null, 'Week ' + data.week + ', ' + data.season), src ? h('span.src', null, src) : null, liveAt || liveErr ? h('span.livesrc', null, liveErr ? 'Live scores unavailable' : 'Live scores as of ' + liveAt.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })) : null, source === 'local' && published ? h('button.btn.sm', { onClick: loadPublished }, 'Load published') : null),
      h('nav.tabs', null, tabs.map(([k, l]) => h('button' + (tab === k ? '.on' : ''), { key: k, onClick: () => setTab(k) }, l)))),
    !loaded ? h('div.empty-state', null, 'Loading\u2026')
      : tab === 'root' ? h(RootingTab, { data: view, analyses, update })
      : tab === 'bets' ? h(BetsTab, { data: view, update })
      : tab === 'pools' ? h(PoolsTab, { data: view, update })
      : h(SetupTab, { data, update, replaceData, onDiscard: loadPublished }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
