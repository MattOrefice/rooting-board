@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap');
.rb{--bg:#0F1A2B;--panel:#172538;--panel2:#1E2F46;--line:#2B3E59;--text:#EEF2F7;--muted:#8FA0B8;--green:#34C77B;--amber:#F2B134;--red:#EF5A5A;--blue:#5AA9FF;
 background:var(--bg);color:var(--text);font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh;font-size:14px;line-height:1.4}
.rb *{box-sizing:border-box}
.rb .disp{font-family:'Barlow Condensed','Oswald','Arial Narrow',system-ui,sans-serif}
.rb .tnum{font-variant-numeric:tabular-nums}
.rb .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px}
.rb .muted{color:var(--muted)}
.rb .ok{color:var(--green)} .rb .bad{color:var(--red)} .rb .warn{color:var(--amber)} .rb .info{color:var(--blue)}
.rb input,.rb select,.rb textarea{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:4px 8px;font:inherit}
.rb input[type=number]{width:72px}
.rb input:focus,.rb select:focus,.rb textarea:focus,.rb button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.rb .btn{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:5px 10px;font-weight:600;color:var(--text);cursor:pointer;font:inherit}
.rb .btn:hover{background:#25395A}
.rb .btn.primary{background:var(--blue);color:#06111F;border-color:var(--blue)}
.rb .btn.danger{border-color:var(--red);color:var(--red)}
.rb .btn.sm{padding:2px 8px;font-size:12px}
.rb .tab{padding:10px 14px;border:0;border-bottom:3px solid transparent;font-weight:600;color:var(--muted);background:none;cursor:pointer;font:inherit}
.rb .tab.on{color:var(--text);border-bottom-color:var(--amber)}
.rb .plate{color:#06111F;padding:6px 12px;font-weight:800;line-height:1;display:inline-block;font-size:24px}
.rb .plate.aligned{background:var(--green)}
.rb .plate.split{background:var(--amber)}
.rb .plate.dead{background:#34465F;color:#C4CFDD}
.rb .plate.wants{background:var(--blue)}
.rb .plate.final{background:#34465F;color:#C4CFDD}
.rb .chip{display:inline-flex;align-items:center;gap:6px;padding:1px 7px;border:1px solid var(--line);border-radius:3px;background:var(--panel2);font-size:12px;font-weight:600;white-space:nowrap}
.rb table{border-collapse:collapse;width:100%}
.rb th{text-align:left;font-weight:600;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px}
.rb td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.rb tr:last-child td{border-bottom:0}
.rb .cell{width:46px;height:30px;border:1px solid var(--line);border-radius:3px;background:var(--panel2);font-weight:700;color:var(--text);cursor:pointer;font:inherit;font-weight:700}
.rb .cell.me{border-color:var(--blue)}
.rb .cell.hit{background:rgba(52,199,123,.2);color:var(--green)}
.rb .cell.miss{background:rgba(239,90,90,.2);color:var(--red)}
.rb .cell.empty{color:var(--muted);font-weight:400}
.rb .bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;width:100%}
.rb .bar>i{display:block;height:100%}
.rb .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rb .stat{padding:8px 12px;border-right:1px solid var(--line)}
.rb .stat:last-child{border-right:0}
.rb .kpi{font-size:22px;font-weight:700;line-height:1.1}
.rb .runbest{background:rgba(52,199,123,.08)}
.rb .grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:760px){.rb .grid{grid-template-columns:1fr 1fr}}
@media(min-width:1180px){.rb .grid{grid-template-columns:1fr 1fr 1fr}}
.rb details>summary{cursor:pointer;color:var(--muted);font-weight:600}
.rb .scroll{overflow-x:auto}
